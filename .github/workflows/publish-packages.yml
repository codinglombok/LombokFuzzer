name: Publish GitHub Packages (all registries)

on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── npm (GitHub Packages) ─────────────────────────────────────────────────
  npm:
    name: npm (GitHub Packages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write   # <-- WAJIB untuk GitHub Packages
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Node.js (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@codinglombok'              # <-- scope org GitHub

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages (npm)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # <-- GITHUB_TOKEN, bukan NPM_TOKEN

  # ── Container (ghcr.io) ──────────────────────────────────────────────────
  container:
    name: Container (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lombokfuzzer:latest
            ghcr.io/${{ github.repository_owner }}/lombokfuzzer:${{ github.ref_name }}

  # ── Maven (webjar) ────────────────────────────────────────────────────────
  maven:
    name: Maven (webjar)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Deploy WebJar to GitHub Packages (Maven)
        run: |
          mvn --batch-mode deploy \
            -Drevision=${{ env.RELEASE_VERSION }} \
            --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── NuGet ─────────────────────────────────────────────────────────────────
  nuget:
    name: NuGet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Set version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Pack NuGet
        run: |
          nuget pack LombokFuzzer.nuspec \
            -Version ${{ env.RELEASE_VERSION }} \
            -OutputDirectory nupkg/

      - name: Push to GitHub Packages (NuGet)
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/codinglombok/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

  # ── RubyGems ──────────────────────────────────────────────────────────────
  rubygems:
    name: RubyGems
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build gem
        run: gem build lombok_fuzzer.gemspec

      - name: Push to GitHub Packages (RubyGems)
        run: |
          gem push --key github \
            --host https://rubygems.pkg.github.com/codinglombok \
            lombok_fuzzer-${{ env.RELEASE_VERSION }}.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.GITHUB_TOKEN }}

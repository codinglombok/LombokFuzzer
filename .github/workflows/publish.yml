name: Publish npm

on:
  release:
    types: [published]

jobs:
  publish-npmjs:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          NORMALIZED="${RELEASE_TAG#v}"
          echo "package.json version : ${PKG_VERSION}"
          echo "release tag          : ${RELEASE_TAG} (normalized: ${NORMALIZED})"
          if [ "${NORMALIZED}" != "${PKG_VERSION}" ]; then
            echo "ERROR: Release tag (${NORMALIZED}) does not match package.json version (${PKG_VERSION})."
            echo "Jika pakai workflow 'Bump Version & Release', ini tidak akan pernah terjadi."
            exit 1
          fi

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
